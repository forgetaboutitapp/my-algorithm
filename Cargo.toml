[package]
name = "my-algorithm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1

[dependencies]
malloc-rust = "1.0.0-beta.2"
prost = { version = "0.14.1", default-features = false }

prost-types = { version = "0.14.1", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
chrono = { version = "0.4.41", default-features = false, features = ["alloc"] }
serde_json = { version = "1.0.143", features = ["alloc"]}

[build-dependencies]
prost-build = { version = "0.13.5", default-features = false }
