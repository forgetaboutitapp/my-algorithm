# Generated basic setup using chatgpt
name: CI

on:
  push:
    branches:
      - main
      - '**'  # This will trigger on pushes to any branch
    tags:
      - 'v*'  # This will trigger on version tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.24'  # Change to your desired Go version
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build 
        run: |
          pwd
          cd ..
          git clone  --depth 1 https://github.com/forgetaboutitapp/protobufs
          cd my-algorithm
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest          
          cargo build --release --target wasm32-unknown-unknown
           cp ./target/wasm32-unknown-unknown/release/my_algorithm.wasm /tmp
           git clone  --depth 1 https://github.com/forgetaboutitapp/forget-about-it
           cd forget-about-it/server
           go build ./cmd/builder
           mkdir -p ${{ github.workspace }}/releases
           ./builder -allocating alloc -author "OrganomagnesiumHalide" -desc "My Custom Algorithm" -freeing "dealloc" -init "init" -license "AGPLv3.0" -mod "env" -version 2 -wasm /tmp/my_algorithm.wasm -website "https://github.com/forgetaboutitapp/my-algorithm" -name "My Algorithm" -download-url "https://github.com/forgetaboutitapp/my-algorithm" -o ${{ github.workspace }}/releases/my-algorithm.json
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.24'  # Change to your desired Go version
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build 
        run: |
           pwd
           cd ..
           git clone  --depth 1 https://github.com/forgetaboutitapp/protobufs
           cd my-algorithm
           sudo apt-get install -y protobuf-compiler
           go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
           cargo build --release --target wasm32-unknown-unknown
           cp ./target/wasm32-unknown-unknown/release/my_algorithm.wasm /tmp
           git clone  --depth 1 https://github.com/forgetaboutitapp/forget-about-it
           cd forget-about-it/server
           go build ./cmd/builder
           mkdir -p ${{ github.workspace }}/releases
           ./builder -allocating alloc -author "OrganomagnesiumHalide" -desc "My Custom Algorithm" -freeing "dealloc" -init "init" -license "AGPLv3.0" -mod "env" -version 2 -wasm /tmp/my_algorithm.wasm -website "https://github.com/forgetaboutitapp/my-algorithm" -name "My Algorithm" -download-url "https://github.com/forgetaboutitapp/my-algorithm" -o ${{ github.workspace }}/releases/my-algorithm.json
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          token: ${{ secrets.RELEASE_TOKEN }}
          files: |
            ${{ github.workspace }}/releases/*
